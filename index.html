<style>
  :root{
    --blue-900:#0B1F3A;--blue-800:#112D52;--blue-700:#174070;--blue-600:#1E5490;
    --blue-500:#2169B8;--blue-400:#3A82D0;--blue-300:#6AAAE4;--blue-200:#A3C8F0;
    --blue-100:#D6E8F9;--blue-50:#EEF5FD;--accent:#12A7F0;
    --lead-900:#141414;--lead-700:#2A2A2A;--lead-600:#373737;--lead-500:#4A4A4A;
    --lead-400:#606060;--lead-300:#888888;--lead-200:#B0B0B0;--lead-100:#D8D8D8;
    --lead-50:#F2F2F2;--white:#fff;--alert:#C2410C;--ok:#0F766E;
    --display:'Syne',sans-serif;--body:'DM Sans',sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
    --sb:236px;--sb-mini:66px;--hdr:60px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  #tvxapp{font-family:var(--body);color:var(--lead-700);background:var(--lead-50);font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
  #tvxapp button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  #tvxapp input,#tvxapp select,#tvxapp textarea{font:inherit;color:inherit}
  #tvxapp :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .ld{padding:80px;text-align:center;color:var(--lead-300);font-family:var(--mono);font-size:12px}

  /* ---------- pré-header ---------- */
  .hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:var(--white);
    border-bottom:1px solid var(--lead-100);box-shadow:0 1px 8px rgba(11,31,58,.06);
    display:flex;align-items:center;gap:16px;padding:0 18px;z-index:40}
  .burger{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--lead-600);transition:background .15s}
  .burger:hover{background:var(--lead-50)}
  .burger span{display:block;width:18px;height:2px;background:currentColor;border-radius:2px;position:relative}
  .burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:currentColor;border-radius:2px}
  .burger span::before{top:-5px}.burger span::after{top:5px}
  .hlogo{height:24px;display:block;background:transparent}
  .hright{margin-left:auto;display:flex;align-items:center;gap:6px}
  .iconbtn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--lead-500);transition:background .15s}
  .iconbtn:hover{background:var(--lead-50);color:var(--blue-700)}
  .badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
    background:var(--accent);color:var(--white);font-family:var(--mono);font-size:9px;font-weight:500;display:grid;place-items:center;border:1.5px solid var(--white)}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue-500),var(--accent));
    display:grid;place-items:center;color:var(--white);font-family:var(--display);font-weight:700;font-size:13px;border:2px solid var(--white);box-shadow:0 0 0 1px var(--lead-100);cursor:pointer}

  /* notif dropdown */
  .notif{position:absolute;top:52px;right:8px;width:340px;max-width:calc(100vw - 20px);max-height:calc(100vh - 80px);
    overflow-y:auto;background:var(--white);border:1px solid var(--lead-100);border-radius:14px;box-shadow:0 18px 50px rgba(11,31,58,.22);z-index:50}
  .notif h4{position:sticky;top:0;background:var(--white)}
  .notif h4{font-family:var(--display);font-size:15px;color:var(--blue-900);padding:14px 16px 10px}
  .ngroup{border-top:1px solid var(--lead-50);padding:10px 16px}
  .ngroup-h{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--lead-400);margin-bottom:7px}
  .ngroup-h .ni{color:var(--blue-500);display:flex}
  .nrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
  .nrow b{font-weight:500;color:var(--lead-800)}
  .nrow span{color:var(--lead-400);font-family:var(--mono);font-size:11px;white-space:nowrap}
  .nempty{font-size:12.5px;color:var(--lead-300)}
  .nfoot{padding:11px 16px;background:var(--lead-50);font-size:11.5px;color:var(--lead-400);font-family:var(--mono)}

  /* ---------- sidebar (azul marinho) ---------- */
  .sb{position:fixed;top:var(--hdr);left:0;bottom:0;width:var(--sb);background:var(--blue-900);
    border-right:1px solid var(--blue-800);padding:14px 12px;z-index:30;transition:width .2s;overflow:hidden}
  .app.mini .sb{width:var(--sb-mini);padding:14px 8px}
  .navi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--blue-100);
    font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .12s,color .12s;width:100%;text-align:left;margin-bottom:2px}
  .navi:hover{background:var(--blue-800);color:var(--white)}
  .navi[aria-current="true"]{background:var(--blue-600);color:var(--white);box-shadow:inset 3px 0 0 var(--accent)}
  .navi[aria-current="true"] .ni{color:var(--white)}
  .ni{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--blue-300)}
  .navi:hover .ni{color:var(--white)}
  .navtx{transition:opacity .15s}
  .app.mini .navtx{opacity:0;width:0;overflow:hidden}
  .app.mini .navi{justify-content:center;padding:11px 0;gap:0}
  .sbsec{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--blue-300);
    padding:14px 12px 6px}
  .app.mini .sbsec{text-align:center;padding:14px 0 6px;font-size:8px}

  /* ---------- main ---------- */
  .main{padding:calc(var(--hdr) + 22px) 24px 40px calc(var(--sb) + 24px);transition:padding .2s;max-width:1600px}
  .app.mini .main{padding-left:calc(var(--sb-mini) + 24px)}
  .pghead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .pgtitle{font-family:var(--display);font-weight:800;font-size:25px;color:var(--blue-900);letter-spacing:-.025em}
  .pgsub{font-size:13px;color:var(--lead-400);margin-top:2px}
  .pgright{margin-left:auto;display:flex;gap:10px;position:relative}

  .btn{padding:10px 17px;border-radius:9px;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s;display:inline-flex;align-items:center;gap:7px}
  .btn-primary{background:var(--blue-900);color:var(--white)}
  .btn-primary:hover{background:var(--blue-700)}
  .btn-ghost{border:1px solid var(--lead-100);color:var(--lead-600);background:var(--white)}
  .btn-ghost:hover{background:var(--lead-50)}
  /* split button */
  .split{display:inline-flex;position:relative}
  .split>.btn{border-top-right-radius:0;border-bottom-right-radius:0}
  .split-caret{background:var(--blue-700);color:var(--white);border-top-right-radius:9px;border-bottom-right-radius:9px;
    padding:0 11px;display:grid;place-items:center;border-left:1px solid var(--blue-600)}
  .split-caret:hover{background:var(--blue-600)}
  .menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--white);border:1px solid var(--lead-100);
    border-radius:11px;box-shadow:0 14px 40px rgba(11,31,58,.18);padding:6px;min-width:180px;z-index:45}
  .menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--lead-700)}
  .menu button:hover{background:var(--blue-50);color:var(--blue-700)}
  .menu .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}

  /* ---------- kanban ---------- */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  .col{background:transparent}
  .colhead{padding-top:11px;border-top:2px solid;display:flex;align-items:center;justify-content:space-between}
  .colname{font-family:var(--display);font-weight:700;font-size:15px;color:var(--blue-900)}
  .colcount{font-family:var(--mono);font-size:11px;color:var(--lead-400)}
  .drop{min-height:80px;display:flex;flex-direction:column;gap:10px;padding:8px 3px;border-radius:10px;transition:background .15s}
  .drop.over{background:var(--blue-100);outline:1px dashed var(--blue-400)}
  .card{background:var(--white);border:1px solid var(--lead-100);border-radius:10px;padding:12px;cursor:grab;transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:var(--blue-300);box-shadow:0 4px 14px rgba(11,31,58,.08)}
  .card.dragging{opacity:.4}
  .card-t{font-family:var(--display);font-weight:600;font-size:14px;color:var(--blue-900)}
  .card-c{font-size:12px;color:var(--lead-400);margin-top:1px}
  .card-d{font-size:12.5px;color:var(--lead-600);margin-top:7px}
  .card-m{display:flex;align-items:center;gap:8px;margin-top:9px;font-family:var(--mono);font-size:10px;color:var(--lead-300);flex-wrap:wrap}
  .tag{font-size:10px;padding:2px 8px;border-radius:20px;font-family:var(--body);font-weight:500}
  .tag-val{background:var(--blue-50);color:var(--blue-700);border:1px solid var(--blue-100)}
  .tag-men{background:#ECFDF5;color:var(--ok);border:1px solid #A7F3D0}
  .flag{color:var(--alert)}

  /* ---------- tabela follow-up ---------- */
  .tbl{background:var(--white);border:1px solid var(--lead-100);border-radius:12px;overflow:visible}
  .trow{display:grid;grid-template-columns:1.1fr 2fr 150px 150px;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--lead-50)}
  .trow.head{border-top:none;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--lead-400)}
  .trow.head span{font-weight:400}
  .tcli{font-weight:500;color:var(--blue-900)}
  .tcli small{display:block;font-weight:400;color:var(--lead-300);font-family:var(--mono);font-size:10px}
  .tdesc{color:var(--lead-600);font-size:13px}
  .fwd{position:relative}
  .fwd-btn{width:100%;border:1px solid var(--lead-100);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--blue-700);
    display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--white)}
  .fwd-btn:hover{border-color:var(--blue-300);background:var(--blue-50)}
  .tdate{font-family:var(--mono);font-size:11px;color:var(--lead-300);text-align:right}
  .empty{padding:44px 20px;text-align:center;color:var(--lead-300);font-size:13px}

  /* ---------- total a receber (faturamento) ---------- */
  .totbox{background:var(--white);border:1px solid var(--lead-100);border-radius:14px;padding:20px 22px;margin-bottom:16px;
    border-top:3px solid var(--accent)}
  .totmain{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .totlbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--lead-400)}
  .totval{font-family:var(--display);font-weight:800;font-size:30px;color:var(--blue-900);letter-spacing:-.02em}
  .totbreak{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--lead-500)}
  .totbreak b{color:var(--blue-700);font-weight:600}

  /* ---------- lista de bloco ---------- */
  .list{display:flex;flex-direction:column;gap:10px}
  .lrow{background:var(--white);border:1px solid var(--lead-100);border-radius:11px;padding:14px 16px;
    display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
  .lrow:hover{border-color:var(--blue-200)}
  .lrow-t{font-family:var(--display);font-weight:600;font-size:15px;color:var(--blue-900)}
  .lrow-s{font-size:12.5px;color:var(--lead-400);margin-top:2px}
  .lrow-r{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11px;color:var(--lead-400)}
  .lrow-r .money{font-family:var(--display);font-size:15px;color:var(--blue-900);font-weight:700}
  .rowdel{color:var(--lead-300);width:30px;height:30px;border-radius:7px}
  .rowdel:hover{background:#FEF2F2;color:var(--alert)}

  /* ---------- modal ---------- */
  .mask{position:fixed;inset:0;background:rgba(11,31,58,.55);display:grid;place-items:center;padding:18px;z-index:60}
  .modal{background:var(--white);border-radius:16px;padding:26px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
  .mtop{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .mdot{width:12px;height:12px;border-radius:50%}
  .mtitle{font-family:var(--display);font-weight:700;font-size:19px;color:var(--blue-900);letter-spacing:-.02em}
  .f{margin-bottom:13px}
  .f label{display:block;font-size:12px;color:var(--lead-500);margin-bottom:4px}
  .f input,.f select,.f textarea{width:100%;border:1px solid var(--lead-100);border-radius:8px;padding:9px 11px;background:var(--lead-50)}
  .f textarea{resize:vertical;min-height:60px}
  .f input:focus,.f select:focus,.f textarea:focus{background:var(--white);border-color:var(--blue-300)}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .fcheck{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 0;cursor:pointer}
  .fcheck input{width:16px;height:16px;accent-color:var(--blue-500)}
  .mact{display:flex;gap:10px;margin-top:8px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--blue-900);color:var(--white);
    padding:11px 20px;border-radius:9px;font-size:13px;z-index:70;box-shadow:0 10px 30px rgba(11,31,58,.3)}

  @media(max-width:1080px){.board{grid-template-columns:1fr 1fr}}
  @media(max-width:820px){
    .app .sb{transform:translateX(-100%);transition:transform .2s}
    .app.open .sb{transform:none;width:var(--sb);box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .main{padding-left:24px!important}
    .trow{grid-template-columns:1fr;gap:6px}.trow.head{display:none}
    .tdate{text-align:left}
  }
  @media(max-width:560px){.board{grid-template-columns:1fr}.pgright{width:100%}.f2{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){#tvxapp *{transition:none!important}}
</style>

/* datas comemorativas — fixas + móveis do ano corrente */
function datasComemorativas(){
  const y=new Date().getFullYear();
  const fix=[['01-01','Confraternização Universal'],['03-08','Dia da Mulher'],['03-15','Dia do Consumidor'],
    ['04-21','Tiradentes'],['06-12','Dia dos Namorados'],['09-15','Dia do Cliente'],['09-07','Independência'],
    ['10-12','Dia das Crianças'],['11-15','Proclamação da República'],['12-25','Natal']];
  const nth=(month,weekday,n)=>{let d=new Date(y,month,1),c=0;while(true){if(d.getDay()===weekday){c++;if(c===n)break}d.setDate(d.getDate()+1)}return d};
  const last=(month,weekday)=>{let d=new Date(y,month+1,0);while(d.getDay()!==weekday)d.setDate(d.getDate()-1);return d};
  const mmdd=dt=>String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  const mov=[[mmdd(nth(4,0,2)),'Dia das Mães'],[mmdd(nth(7,0,2)),'Dia dos Pais'],[mmdd(last(10,5)),'Black Friday']];
  return [...fix,...mov];
}

/* armazenamento resiliente: window.storage (dentro do Claude) → localStorage (arquivo baixado) → memória */
const mem={};
const store={
  async get(k){
    if(typeof window!=='undefined'&&window.storage&&window.storage.get){
      try{const r=await window.storage.get(k);return r?r.value:null;}catch(e){return null;}
    }
    try{return localStorage.getItem(k);}catch(e){return k in mem?mem[k]:null;}
  },
  async set(k,v){
    if(typeof window!=='undefined'&&window.storage&&window.storage.set){
      try{await window.storage.set(k,v);return;}catch(e){}
    }
    try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}
  }
};

function uuidv4(){
  if(typeof crypto!=='undefined'&&crypto.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});
}

let idsConhecidos=new Set();

async function carregar(){
  const u=await store.get(KEY+'-ui');
  if(u){try{Object.assign(ui,JSON.parse(u));}catch(e){}}
  if(online()){
    try{
      const {data,error}=await sb.from('registros').select('*').order('created_at',{ascending:true});
      if(error)throw error;
      dados=(data||[]).map(fromRow);
      idsConhecidos=new Set(dados.map(d=>d.id));
    }catch(e){ dados=[]; idsConhecidos=new Set(); toast('Não consegui ler o banco. A tabela "registros" já foi criada?'); }
  }else{
    const raw=await store.get(KEY);
    try{dados=raw?JSON.parse(raw):seed();}catch(e){dados=seed();}
    if(!raw)await store.set(KEY,JSON.stringify(dados));
  }
  carregado=true; render();
}
async function salvar(){
  if(online()){
    try{
      const rows=dados.map(toRow);
      if(rows.length){const {error}=await sb.from('registros').upsert(rows,{onConflict:'id'}); if(error)throw error;}
      const atuais=new Set(dados.map(d=>d.id));
      const remover=[...idsConhecidos].filter(id=>!atuais.has(id));
      if(remover.length){const {error}=await sb.from('registros').delete().in('id',remover); if(error)throw error;}
      idsConhecidos=atuais;
    }catch(e){ toast('Erro ao salvar no banco.'); }
    return;
  }
  await store.set(KEY,JSON.stringify(dados));
}
async function salvarUI(){await store.set(KEY+'-ui',JSON.stringify({mini:ui.mini}));}

/* ---------------- render ---------------- */
function render(){
  if(!carregado)return;
  app.className='app'+(ui.mini?' mini':'')+(ui.open?' open':'');
  app.innerHTML = header() + sidebar() + `<main class="main">${pagina()}</main>` + (modal?modalHTML():'');
  liga();
}

  const n=notificacoes(), total=n.reduce((a,g)=>a+g.itens.length,0);
  const email=usuario?.email||'', ini=email?email.slice(0,2).toUpperCase():'TV';
  return `<header class="hdr">
    <button class="burger" data-burger title="Menu"><span></span></button>
    <img class="hlogo" src="${LOGO}" alt="Teovox">
    <div class="hright">
      <button class="iconbtn" data-bell aria-label="Notificações">${svg(ICON.bell,20)}${total?`<span class="badge">${total}</span>`:''}</button>
      <div class="profwrap">
        <div class="avatar" data-profile title="${esc(email||'Perfil')}">${esc(ini)}</div>
        ${profMenu?`<div class="profmenu" data-profmenu>
          <div class="pinfo"><div class="pmail">${esc(email||'Sessão local')}</div><div class="prole">${usuario?'conectado':'sem login'}</div></div>
          ${usuario?`<button data-logout>${svg('M16 17l5-5-5-5M21 12H9M13 21H5a2 2 0 01-2-2V5a2 2 0 012-2h8',15)} Sair</button>`
            :`<button data-relogin style="color:#0B1F3A">${svg('M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3',15)} Entrar</button>`}
        </div>`:''}
      </div>
    </div>
    ${notifOpen?notifHTML(n):''}
  </header>`;
}

function notifHTML(grupos){
  return `<div class="notif" data-notif>
    <h4>Notificações de hoje</h4>
    ${grupos.map(g=>`<div class="ngroup">
      <div class="ngroup-h"><span class="ni">${svg(g.icon,14)}</span>${g.titulo}</div>
      ${g.itens.length?g.itens.map(i=>`<div class="nrow"><b>${esc(i.a)}</b><span>${esc(i.b)}</span></div>`).join('')
        :`<div class="nempty">Nada para hoje.</div>`}
    </div>`).join('')}
    <div class="nfoot">Atualizado ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
  </div>`;
}

function notificacoes(){
  const t=hojeISO(), dd=new Date().getDate();
  const amanha=new Date(Date.now()+864e5).toISOString().slice(0,10);
  const servicos=dados.filter(d=>['demanda','orcamento','execucao'].includes(d.bloco)&&d.prazo===t);
  const pendencias=dados.filter(d=>d.bloco!=='faturamento'&&d.prazo&&d.prazo<t);
  const pagamentos=dados.filter(d=>d.bloco==='faturamento'&&+d.diaPagamento===dd);
  const faturamentosDia=dados.filter(d=>d.bloco==='faturamento'&&d.criado===t);
  const agenda=dados.filter(d=>d.prazo===amanha);
  const followup=dados.filter(d=>d.bloco==='followup');
  const mmdd=t.slice(5);
  const y=new Date().getFullYear(), hoje0=new Date().setHours(0,0,0,0);
  const datas=datasComemorativas().map(d=>{const[m,day]=d[0].split('-');
    const diff=Math.ceil((new Date(y,+m-1,+day)-hoje0)/864e5);return{nome:d[1],diff}});
  const dataHoje=datas.filter(x=>x.diff===0);
  const proxData=datas.filter(x=>x.diff>0&&x.diff<=10).sort((a,b)=>a.diff-b.diff).slice(0,1);
  return [
    {titulo:'Serviços do dia',icon:ICON.execucao,itens:servicos.map(s=>({a:s.titulo||s.cliente,b:BLOCOS[s.bloco].nome}))},
    {titulo:'Pendências do dia',icon:ICON.demanda,itens:pendencias.map(s=>({a:s.titulo||s.cliente,b:'venceu '+dataBR(s.prazo)}))},
    {titulo:'Pagamentos do dia',icon:ICON.faturamento,itens:pagamentos.map(s=>({a:s.cliente,b:'R$ '+reais(s.valor)}))},
    {titulo:'Faturamentos do dia',icon:ICON.orcamento,itens:faturamentosDia.map(s=>({a:s.cliente,b:'novo · R$ '+reais(s.valor)}))},
    {titulo:'Data comemorativa',icon:ICON.demanda,itens:[...dataHoje.map(p=>({a:p.nome,b:'hoje'})),...proxData.map(p=>({a:p.nome,b:`em ${p.diff}d`}))]},
    {titulo:'Lembretes da agenda',icon:ICON.fluxo,itens:agenda.map(s=>({a:s.titulo||s.cliente,b:'amanhã'}))},
    {titulo:'Lembretes do Follow-up',icon:ICON.followup,itens:followup.map(s=>({a:s.cliente,b:'aguarda encaminhar'}))},
  ];
}

function sidebar(){
  const item=(pg,ic,tx)=>`<button class="navi" data-nav="${pg}" aria-current="${ui.pagina===pg}" title="${tx}"><span class="ni">${svg(ic)}</span><span class="navtx">${tx}</span></button>`;
  return `<aside class="sb">
    ${item('followup',ICON.followup,'Follow-up')}
    ${ORDEM.map(b=>item(b,ICON[b],BLOCOS[b].nome)).join('')}
  </aside>`;
}

/* -------- páginas -------- */
function pagina(){
  if(!['followup',...ORDEM].includes(ui.pagina))ui.pagina='followup';
  if(ui.pagina==='followup')return pgFollowup();
  return pgBloco(ui.pagina);
}

function pgFluxo(){
  const btn=`<div class="split" data-splitroot>
    <button class="btn btn-primary" data-splitmain>${svg(BLOCOS.demanda.icon||ICON.demanda,15)}Adicionar</button>
    <button class="split-caret" data-splittoggle>${svg('M6 9l6 6 6-6',14)}</button>
    <div class="menu" data-splitmenu hidden>${ORDEM.map(b=>`<button data-add="${b}"><span class="dot" style="background:${BLOCOS[b].cor}"></span>${BLOCOS[b].nome}</button>`).join('')}</div>
  </div>`;
  const board=`<div class="board">${ORDEM.map(b=>{
    const itens=dados.filter(d=>d.bloco===b);
    return `<div class="col"><div class="colhead" style="border-color:${BLOCOS[b].cor}">
      <span class="colname">${BLOCOS[b].nome}</span><span class="colcount">${itens.length}</span></div>
      <div class="drop" data-drop="${b}">${itens.length?itens.map(card).join(''):`<div class="empty" style="padding:22px 8px;font-size:12px">Vazio</div>`}</div>
    </div>`;
  }).join('')}</div>`;
  return head('Fluxo de Solicitações','Arraste os cards entre os blocos ou adicione um novo registro.',btn)+board;
}

function card(d){
  const b=BLOCOS[d.bloco], atrasado=d.prazo&&d.prazo<hojeISO();
  return `<div class="card" draggable="true" data-id="${d.id}" data-edit="${d.id}">
    <div class="card-t">${esc(d.titulo||d.cliente)}</div>
    <div class="card-c">${esc(d.cliente)}${d.responsavel?' · '+esc(d.responsavel):''}</div>
    ${d.descricao?`<div class="card-d">${esc(d.descricao)}</div>`:''}
    <div class="card-m">
      ${b.money&&d.valor?`<span class="tag tag-val">R$ ${reais(d.valor)}</span>`:''}
      ${b.money&&d.mensalista?`<span class="tag tag-men">Mensalista</span>`:''}
      ${b.money&&d.diaPagamento?`<span>venc. dia ${esc(d.diaPagamento)}</span>`:''}
      ${d.prazo?`<span class="${atrasado?'flag':''}">${atrasado?'⚠ ':''}${dataBR(d.prazo)}</span>`:''}
    </div>
  </div>`;
}

function pgFollowup(){
  const itens=dados.filter(d=>d.bloco==='followup');
  const btn=`<button class="btn btn-primary" data-newfollow>${svg(ICON.demanda,15)}Novo item</button>`;
  const linhas=itens.length?itens.map(d=>`<div class="trow">
    <div class="tcli">${esc(d.cliente)}<small>${dataBR(d.criado)}</small></div>
    <div class="tdesc">${esc(d.descricao)||'—'}</div>
    <div class="fwd" data-splitroot>
      <button class="fwd-btn" data-splittoggle>Encaminhar ${svg('M6 9l6 6 6-6',13)}</button>
      <div class="menu" data-splitmenu hidden>${ORDEM.map(b=>`<button data-fwd="${d.id}" data-bloco="${b}"><span class="dot" style="background:${BLOCOS[b].cor}"></span>${BLOCOS[b].nome}</button>`).join('')}</div>
    </div>
    <div class="tdate"><button class="rowdel" data-del="${d.id}" title="Remover">${svg('M6 6l12 12M18 6L6 18',15)}</button></div>
  </div>`).join(''):`<div class="empty">Nenhuma solicitação em aberto. Novos pedidos do cliente entram aqui antes de virar Demanda.</div>`;
  return head('Follow-up','Solicitações recebidas aguardando encaminhamento.',btn)
    +`<div class="tbl"><div class="trow head"><span>Cliente</span><span>Descrição</span><span>Encaminhar</span><span></span></div>${linhas}</div>`;
}

function pgBloco(b){
  const cfg=BLOCOS[b], itens=dados.filter(d=>d.bloco===b);
  const btn=`<button class="btn btn-primary" data-new="${b}">${svg(ICON[b],15)}${cfg.verbo}</button>`;
  const linhas=itens.length?`<div class="list">${itens.map(d=>`<div class="lrow" data-edit="${d.id}" style="cursor:pointer">
    <div><div class="lrow-t">${esc(d.titulo||d.cliente)}</div>
      <div class="lrow-s">${esc(d.cliente)}${d.responsavel?' · '+esc(d.responsavel):''}${d.descricao?' — '+esc(d.descricao):''}</div></div>
    <div class="lrow-r">
      ${cfg.money&&d.valor?`<span class="money">R$ ${reais(d.valor)}</span>`:''}
      ${cfg.money&&d.mensalista?`<span class="tag tag-men">Mensalista</span>`:''}
      ${cfg.money&&d.diaPagamento?`<span>dia ${esc(d.diaPagamento)}</span>`:''}
      ${d.prazo?`<span>${dataBR(d.prazo)}</span>`:''}
      <button class="rowdel" data-del="${d.id}" title="Remover">${svg('M6 6l12 12M18 6L6 18',15)}</button>
    </div></div>`).join('')}</div>`
    :`<div class="empty">Nenhum registro em ${cfg.nome}. Use “${cfg.verbo}” ou encaminhe um item do Follow-up.</div>`;

  // Faturamento: botão desce para baixo do "Total a receber"
  if(b==='faturamento'){
    const num=v=>parseFloat(String(v||0).replace(/\./g,'').replace(',','.'))||0;
    const total=itens.reduce((s,d)=>s+num(d.valor),0);
    const rec=itens.filter(d=>d.mensalista).reduce((s,d)=>s+num(d.valor),0);
    const avulso=total-rec;
    const fmt=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2});
    const totalbox=`<div class="totbox">
      <div class="totmain"><span class="totlbl">Total a receber</span><span class="totval">R$ ${fmt(total)}</span></div>
      <div class="totbreak"><span>Recorrente (mensalistas): <b>R$ ${fmt(rec)}</b></span><span>Avulso: <b>R$ ${fmt(avulso)}</b></span></div>
      <button class="btn btn-primary" data-new="faturamento" style="margin-top:14px">${svg(ICON.faturamento,15)}${cfg.verbo}</button>
    </div>`;
    return head(cfg.nome,descBloco(b),'')+totalbox+linhas;
  }
  return head(cfg.nome,descBloco(b),btn)+linhas;
}
const descBloco=b=>({demanda:'Pedidos aceitos, aguardando orçamento.',orcamento:'Propostas em elaboração e aprovação.',execucao:'Trabalhos em produção.',faturamento:'Contratos e cobranças ativas.'}[b]);

function head(titulo,sub,botao){
  return `<div class="pghead"><div><div class="pgtitle">${titulo}</div><div class="pgsub">${sub}</div></div><div class="pgright">${botao}</div></div>`;
}

/* -------- modal -------- */
function modalHTML(){
  const b=modal.bloco, cfg=BLOCOS[b]||{}, d=modal.id?dados.find(x=>x.id===modal.id):{};
  const isFollow=b==='followup';
  const campoMoney=cfg.money?`
    <div class="f2">
      <div class="f"><label>Valor (R$)</label><input id="f-valor" value="${esc(d.valor)}" placeholder="Ex: 2.500,00"></div>
      <div class="f"><label>Dia do pagamento</label><input id="f-dia" type="number" min="1" max="31" value="${esc(d.diaPagamento)}" placeholder="Ex: 10"></div>
    </div>
    <label class="fcheck"><input type="checkbox" id="f-mens" ${d.mensalista?'checked':''}> Mensalista (cobrança recorrente)</label>`:'';
  const corpo=isFollow?`
    <div class="f"><label>Cliente</label><input id="f-cli" value="${esc(d.cliente)}" placeholder="Nome do cliente"></div>
    <div class="f"><label>Descrição da solicitação</label><textarea id="f-desc" placeholder="O que o cliente pediu?">${esc(d.descricao)}</textarea></div>`
  :`
    <div class="f"><label>Título</label><input id="f-tit" value="${esc(d.titulo)}" placeholder="Ex: Campanha de fim de ano"></div>
    <div class="f2">
      <div class="f"><label>Cliente</label><input id="f-cli" value="${esc(d.cliente)}" placeholder="Nome"></div>
      <div class="f"><label>Responsável</label><input id="f-resp" value="${esc(d.responsavel)}" placeholder="Ex: Téo"></div>
    </div>
    <div class="f"><label>Descrição</label><textarea id="f-desc" placeholder="Detalhes do serviço">${esc(d.descricao)}</textarea></div>
    <div class="f"><label>Prazo</label><input id="f-prazo" type="date" value="${esc(d.prazo)}"></div>
    ${campoMoney}`;
  const titulo=modal.id?`Editar — ${isFollow?'Follow-up':cfg.nome}`:(isFollow?'Novo item de Follow-up':cfg.verbo);
  return `<div class="mask" data-close><div class="modal" role="dialog" aria-modal="true">
    <div class="mtop"><span class="mdot" style="background:${isFollow?'#888':cfg.cor}"></span><span class="mtitle">${titulo}</span></div>
    ${corpo}
    <div class="mact"><button class="btn btn-primary" data-save>Salvar</button><button class="btn btn-ghost" data-close>Cancelar</button></div>
  </div></div>`;
}

/* ---------------- eventos ---------------- */
function fecharMenus(){document.querySelectorAll('[data-splitmenu]').forEach(m=>m.hidden=true)}

function liga(){
  app.querySelector('[data-burger]').onclick=async()=>{
    if(window.innerWidth<=820)ui.open=!ui.open; else{ui.mini=!ui.mini;salvarUI()} render();
  };
  const bell=app.querySelector('[data-bell]');
  if(bell)bell.onclick=e=>{e.stopPropagation();notifOpen=!notifOpen;render();};
  const prof=app.querySelector('[data-profile]');
  if(prof)prof.onclick=e=>{e.stopPropagation();profMenu=!profMenu;notifOpen=false;render();};
  const lo=app.querySelector('[data-logout]'); if(lo)lo.onclick=logout;
  const rl=app.querySelector('[data-relogin]'); if(rl)rl.onclick=()=>{profMenu=false;renderAuth();};
  app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ui.pagina=b.dataset.nav;ui.open=false;notifOpen=false;render();});

  // split buttons (Adicionar / Encaminhar)
  app.querySelectorAll('[data-splittoggle]').forEach(t=>t.onclick=e=>{
    e.stopPropagation();const menu=t.closest('[data-splitroot]').querySelector('[data-splitmenu]');
    const abrir=menu.hidden;fecharMenus();menu.hidden=!abrir;
  });
  const sm=app.querySelector('[data-splitmain]');
  if(sm)sm.onclick=e=>{e.stopPropagation();const menu=sm.closest('[data-splitroot]').querySelector('[data-splitmenu]');const abrir=menu.hidden;fecharMenus();menu.hidden=!abrir;};
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{fecharMenus();modal={bloco:b.dataset.add};render();});

  // add buttons per page
  app.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{modal={bloco:b.dataset.new};render();});
  const nf=app.querySelector('[data-newfollow]');
  if(nf)nf.onclick=()=>{modal={bloco:'followup'};render();};

  // encaminhar (follow-up → bloco)
  app.querySelectorAll('[data-fwd]').forEach(b=>b.onclick=async()=>{
    const d=dados.find(x=>x.id===b.dataset.fwd); if(!d)return;
    d.bloco=b.dataset.bloco; d.titulo=d.titulo||(d.descricao?d.descricao.slice(0,40):d.cliente);
    fecharMenus(); await salvar(); render(); toast(`Encaminhado para ${BLOCOS[b.dataset.bloco].nome}`);
  });

  // editar / remover
  app.querySelectorAll('[data-edit]').forEach(c=>c.onclick=e=>{
    if(e.target.closest('[data-del]'))return;
    modal={bloco:dados.find(x=>x.id===c.dataset.edit)?.bloco,id:c.dataset.edit};render();
  });
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();const d=dados.find(x=>x.id===b.dataset.del);
    if(!confirm(`Remover "${d.titulo||d.cliente}"?`))return;
    dados=dados.filter(x=>x.id!==b.dataset.del);await salvar();render();
  });

  // drag & drop no kanban
  app.querySelectorAll('.card').forEach(cd=>{
    cd.ondragstart=e=>{e.dataTransfer.setData('text/plain',cd.dataset.id);cd.classList.add('dragging');};
    cd.ondragend=()=>cd.classList.remove('dragging');
  });
  app.querySelectorAll('[data-drop]').forEach(z=>{
    z.ondragover=e=>{e.preventDefault();z.classList.add('over');};
    z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=async e=>{e.preventDefault();z.classList.remove('over');
      const d=dados.find(x=>x.id===e.dataTransfer.getData('text/plain'));
      if(d&&d.bloco!==z.dataset.drop){d.bloco=z.dataset.drop;await salvar();}render();};
  });

  // modal
  app.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{if(e.target===b){modal=null;render();}});
  const sv=app.querySelector('[data-save]');
  if(sv)sv.onclick=async()=>{
    const b=modal.bloco, isFollow=b==='followup';
    const get=id=>{const el=app.querySelector('#'+id);return el?el.value.trim():'';};
    const cli=get('f-cli');
    if(!cli){app.querySelector('#f-cli').focus();toast('Informe o cliente.');return;}
    const base={cliente:cli, descricao:get('f-desc')};
    let campos;
    if(isFollow){campos={...base};}
    else{
      campos={...base, titulo:get('f-tit')||cli, responsavel:get('f-resp'), prazo:get('f-prazo')};
      if(BLOCOS[b].money){campos.valor=get('f-valor'); campos.diaPagamento=get('f-dia');
        campos.mensalista=app.querySelector('#f-mens').checked;}
    }
    if(modal.id){Object.assign(dados.find(x=>x.id===modal.id),campos);}
    else{dados.push({id:uuidv4(),bloco:b,criado:hojeISO(),...campos});}
    modal=null;await salvar();render();
  };
  const first=app.querySelector('#f-tit')||app.querySelector('#f-cli');
  if(first)first.focus();
}

document.addEventListener('click',e=>{
  if(!e.target.closest('[data-splitroot]'))fecharMenus();
  if(notifOpen&&!e.target.closest('[data-notif]')&&!e.target.closest('[data-bell]')){notifOpen=false;render();}
  if(profMenu&&!e.target.closest('[data-profmenu]')&&!e.target.closest('[data-profile]')){profMenu=false;render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal){modal=null;render();}else if(notifOpen){notifOpen=false;render();}else if(profMenu){profMenu=false;render();}}});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}

    <div class="authf"><label>Senha</label><input id="au-pass" type="password" placeholder="Mínimo 6 caracteres" autocomplete="${authTab==='login'?'current-password':'new-password'}"></div>
    <button class="authbtn" data-authsubmit ${cfg?'':'disabled'}>${authTab==='login'?'Entrar':'Criar conta'}</button>
    ${!cfg?`<button class="authskip" data-authskip>Entrar em modo local (sem login)</button>`:''}
  </div>`;

  o.querySelectorAll('[data-authtab]').forEach(b=>b.onclick=()=>{authTab=b.dataset.authtab;authMsg=null;renderAuth();});
  const sub=o.querySelector('[data-authsubmit]'); if(sub)sub.onclick=submitAuth;
  const skip=o.querySelector('[data-authskip]'); if(skip)skip.onclick=()=>{usuario=null;esconderAuth();iniciarApp();};
  o.querySelectorAll('input').forEach(inp=>inp.onkeydown=e=>{if(e.key==='Enter'&&cfg)submitAuth();});
  const f=o.querySelector('#au-mail'); if(f)f.focus();
}
function esconderAuth(){const o=document.getElementById('tvxauth');if(o)o.classList.add('hide');}

async function submitAuth(){
  if(!sb){authMsg={tipo:'err',txt:'Cliente Supabase não carregou. Verifique sua conexão.'};return renderAuth();}
  const mail=(document.getElementById('au-mail').value||'').trim();
  const pass=(document.getElementById('au-pass').value||'').trim();
  if(!mail||!pass){authMsg={tipo:'err',txt:'Preencha e-mail e senha.'};return renderAuth();}
  const btn=document.querySelector('[data-authsubmit]'); if(btn){btn.disabled=true;btn.textContent='Aguarde…';}
  try{
    if(authTab==='login'){
      const {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass});
      if(error)throw error;
      usuario=data.user; authMsg=null; esconderAuth(); iniciarApp();
    }else{
      const nome=(document.getElementById('au-nome')?.value||'').trim();
      const {data,error}=await sb.auth.signUp({email:mail,password:pass,options:{data:{nome}}});
      if(error)throw error;
      if(data.session){usuario=data.user; esconderAuth(); iniciarApp();}
      else{authMsg={tipo:'ok',txt:'Conta criada! Confirme o e-mail que enviamos para ativar o acesso e depois faça login.'};authTab='login';renderAuth();}
    }
  }catch(err){
    authMsg={tipo:'err',txt:traduzErro(err?.message||'Erro ao autenticar.')};renderAuth();
  }
}
function traduzErro(m){
  const map={'Invalid login credentials':'E-mail ou senha incorretos.',
    'User already registered':'Este e-mail já tem conta. Faça login.',
    'Password should be at least 6 characters':'A senha precisa ter ao menos 6 caracteres.',
    'Email not confirmed':'Confirme seu e-mail antes de entrar.'};
  return map[m]||m;
}

async function initAuth(){
  authOverlayEl(); renderAuth();
  if(!supabaseConfigurado())return;            // sem chave → fica na tela de config
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data}=await sb.auth.getSession();
    if(data?.session){usuario=data.session.user; esconderAuth(); iniciarApp();}
    sb.auth.onAuthStateChange((_e,session)=>{
      usuario=session?.user||null;
      if(!usuario){carregado&&render();} 
    });
  }catch(e){
    authMsg={tipo:'err',txt:'Não foi possível iniciar o Supabase aqui. Abra o app num navegador com internet.'};renderAuth();
  }
}
async function logout(){try{await sb?.auth.signOut();}catch(e){} usuario=null; usuarioCarregado='__none__'; profMenu=false; authTab='login'; authMsg=null; renderAuth();}

let usuarioCarregado='__none__';
function iniciarApp(){
  const marca=online()?usuario.id:'__local__';
  if(marca!==usuarioCarregado){ usuarioCarregado=marca; carregado=false; carregar(); }
  else render();
}

initAuth();
</script>
